stream.rules = [
    {
      matches = [ {
        application.name = "sendspin-cli"
        media.class = "Stream/Output/Audio"
        target.object = "~^sendspin_(zone-1|zone-2|zone-3|zone-4|zone-5|zone-6|zone-7)$"
      } ]
      actions = { update-props = {
        node.dont-fallback = true
        node.dont-move = true
      } }
    }
]
